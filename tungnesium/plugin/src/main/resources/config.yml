# ---------------- Standings ----------------
# Read from the MAIN scoreboard (where your datapacks/Skript keep scores).
standings:
  push-interval-seconds: 15
  # Objective holding each team's total points. Leave "" to add up the games below instead.
  team-total-objective: ""
  # Objective holding each player's total points. Leave "" to add up the games below instead.
  player-total-objective: ""

# One entry per game. The key is the id you use in /tungnesium loading <id> (and the loading art file name).
# team-objective / player-objective are scoreboard objective names; leave "" if the game has none.
games:
  ace_race:
    name: "Ace Race"
    team-objective: ""
    player-objective: ""
  battle_box:
