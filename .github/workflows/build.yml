name: Build Tungnesium
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client mod
        working-directory: tungnesium/mod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Build server plugin
        working-directory: tungnesium/plugin
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tungnesium-jars
          path: |
            tungnesium/mod/build/libs/tungnesium-*.jar
            tungnesium/plugin/build/libs/tungnesium-plugin-*.jar
